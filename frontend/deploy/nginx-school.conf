server {
    server_name school.aflix.co.in;

    root /var/www/school/frontend/dist;
    index index.html;

    access_log /var/log/nginx/school.aflix.co.in.access.log;
    error_log /var/log/nginx/school.aflix.co.in.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/school/frontend/deploy/acme;
        try_files $uri =404;
    }

    # Always revalidate the app entry point after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Authentication and data requests go directly to hosted Supabase.
    location /api/ {
        default_type application/json;
        return 410 '{"error":"This application now uses Supabase. Reload the page to get the current version."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/school.aflix.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/school.aflix.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = school.aflix.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name school.aflix.co.in;
    return 404; # managed by Certbot


}